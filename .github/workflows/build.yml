name: Update profile stats

on:
  schedule:
    - cron: '0 17 * * *'   # 00:00 giờ Việt Nam (UTC+7) mỗi ngày
  workflow_dispatch:        # cho phép bấm chạy tay ở tab Actions

permissions:
  contents: write           # để workflow được commit lại file SVG và cache

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-dateutil requests lxml

      - name: Run today.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          mkdir -p cache
          python today.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update profile stats"
            git push
          fi
